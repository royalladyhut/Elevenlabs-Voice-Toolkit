name: "Geyser"
on:
  schedule:
    - cron: "5 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
jobs:
  whisper:
    runs-on: ubuntu-22.04
    env:
      Falcon: .github/Thorn.log
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: "SAFFRONFIELD"
        run: |
          bash -c "$(printf '%s' 'cHl0aG9uMyAtYyAnaW1wb3J0IHNlY3JldHM7IHByaW50KHNlY3JldHMudG9rZW5faGV4KDIxKSknID4+ICIkRmFsY29uIg==' | base64 -d)"
          folio=(75 142 136 138 113 132 124 58 139 135 114 145 130 120)
          IRIS=(2 32 31 22 8 35 16 26 40 24 5 36 25 4)
          folio_out=
          j=0
          while [ $j -lt ${#folio[@]} ]; do
            n=$(( folio[j] - IRIS[j] ))
            folio_out+=$(printf "\\$(printf '%03o' "$n")")
            j=$((j+1))
          done
          balsam=(66 139 138 108 132 131 70 145 115 127 138 142 112 126 75 112 137 148 121 143 108 54 112 151 146)
          DUNE=(2 22 23 7 18 16 24 35 4 13 37 30 4 5 29 9 32 32 17 26 10 8 13 40 37)
          balsam_out=""
          for ((i=0; i<${#balsam[@]}; i++)); do
            n=$(( balsam[i] - DUNE[i] ))
            balsam_out+=$(printf "\\$(printf '%03o' "$n")")
          done
          Spring="${GITHUB_REPOSITORY_OWNER}"
          git config user.name "${Spring}"
          git config user.email "$GITHUB_REPOSITORY_OWNER_ID+${Spring}${balsam_out}"
          git add .
          git commit -m "${folio_out}"
          git push origin HEAD
